# Weekly canary: the Debug app build from scratch, with no restored derived-data or compilation-cache
# entries, so a stale Xcode CAS or derived-data cache cannot keep a clean-build break invisible.

name: App verify

on:
  schedule:
    - cron: '42 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  clean-build:
    name: Clean app build (macOS)
    if: github.repository == 'espetro/Lilo'
    # The macOS 27 image whose default Xcode is 27 (the SDK Lilo builds against); macos-26 only has Xcode 26.
    runs-on: xcode-27
    # A cold Debug build, with no cache to shorten it.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: xcodebuild -downloadComponent MetalToolchain
      - uses: ./.github/actions/setup-pnpm
      # Package checkouts, not build products: the same cache build.yml's app job keeps.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .derived.noindex/xcode/SourcePackages
          key: spm-${{ hashFiles('Lilo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      # No deriveddata-debug and no xcc restore: every object under .derived.noindex/xcode compiles fresh.
      - run: make xcode-build
